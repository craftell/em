name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'emviz-v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm install -g npm@latest
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.0 --activate

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          tag_version="${RELEASE_TAG#emviz-v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag version ($tag_version) does not match emviz package version ($package_version)." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      - run: mkdir -p artifacts
      - run: pnpm --filter emviz pack --pack-destination ./artifacts

      - run: npm publish ./artifacts/emviz-*.tgz --access public --provenance

      - name: Print verification instructions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## emviz published"
            echo ""
            echo '```sh'
            echo "npm view emviz version"
            echo "npx emviz@${RELEASE_TAG#emviz-v} --help"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
